[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsfp-tune"
version = "0.1.0"
description = "Autotune (pitch correction) built on Fourier-transform analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# soundfile (libsndfile >= 1.1) can decode MP3 without ffmpeg
soundfile = ["soundfile>=0.12"]
plot = ["matplotlib>=3.7"]
dsp = ["scipy>=1.10"]
dev = ["pytest>=7", "matplotlib>=3.7", "scipy>=1.10", "soundfile>=0.12", "jupyter"]

[project.scripts]
dsfp-inspect = "dsfp_tune.cli:inspect_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
